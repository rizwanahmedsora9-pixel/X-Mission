# RNS-OS — Debian 12 (bookworm) automated installation.
#
# Injected into the Debian netinst ISO by tools/../iso/build-iso.sh and read
# by the installer as preseed/file=/cdrom/preseed.cfg. The whole install runs
# unattended: partition the disk, install the base system plus the hotspot
# stack, copy the RNS-OS payload in, enable the units, reboot.
#
# SECURITY: the passwords below are the well-known appliance defaults and are
# printed in the README. rns-firstboot.service generates a separate random
# password for the STAFF PANEL, but the Linux root/rns passwords stay as they
# are here until you change them (`passwd`). Do not expose this VM's SSH port
# to the internet.

### localisation
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

### network (the installer needs it for the mirror)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string rns-os
d-i netcfg/get_domain string lan
d-i hw-detect/load_firmware boolean true

### accounts
d-i passwd/root-login boolean true
d-i passwd/root-password password rnsos
d-i passwd/root-password-again password rnsos
d-i passwd/make-user boolean true
d-i passwd/user-fullname string RNS Operator
d-i passwd/username string rns
d-i passwd/user-password password rnsos
d-i passwd/user-password-again password rnsos
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### clock
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Karachi
d-i clock-setup/ntp boolean true

### partitioning: one plain ext4 disk, no LVM.
# A 20 GB VirtualBox disk is plenty: the database is a few TSV files and the
# operator's vouchers survive because /var/lib/rns is a normal directory they
# can copy out of the VM or back up from the staff panel.
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/sda
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### mirror
d-i apt-setup/use_mirror boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

### packages
# busybox is not decoration: the gateway engine calls "$BB" <applet> for its
# text processing, exactly as it does on the phone, so behaviour matches the
# Magisk build. Removing it breaks the portal.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server dnsmasq hostapd iptables iproute2 busybox iw wireless-tools tcpdump curl ca-certificates kmod procps
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### finish: install the appliance payload.
# /cdrom is the ISO, so the payload travels inside the image we booted from.
# The two symlinks point the Android paths the shared engine still uses
# (/data/adb/rns, /data/local/tmp) at the real RNS-OS locations, which is why
# the engine does not have to be forked to run on Linux.
d-i preseed/late_command string \
  mkdir -p /target/data/adb /target/data/local; \
  cp -a /cdrom/rns-payload/. /target/; \
  in-target ln -sfn /var/lib/rns /data/adb/rns; \
  in-target ln -sfn /var/log/rns /data/local/tmp; \
  in-target chmod 755 /usr/local/bin/rns /usr/local/sbin/rns-os-ctl; \
  in-target systemctl enable rns-firstboot.service rns-net.service rns-dhcp.service rns-ap.service rns-gateway.service; \
  in-target systemctl disable dnsmasq.service || true; \
  in-target systemctl disable hostapd.service || true; \
  in-target mkdir -p /var/lib/rns /var/log/rns

d-i finish-install/reboot_in_progress note
