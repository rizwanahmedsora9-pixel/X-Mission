name: Build RNS-OS ISO

# Builds the bootable RNS-OS installer ISO (`RNS-OS/dist/RNS-OS-<ver>-amd64.iso`)
# on a GitHub runner, so nobody needs a Linux box, WSL or Docker to get one.
#
# What it does, in order:
#   1. runs RNS-OS/tools/os-selftest.sh — 127+ checks against the exact payload
#      the ISO will carry. A broken appliance never becomes an ISO.
#   2. downloads the pinned Debian 12 amd64 netinst image (verified against the
#      SHA256 Debian publishes) and builds the ISO with xorriso.
#   3. checks the result really is a bootable ISO9660 image, and writes
#      SHA256SUMS beside it.
#   4. uploads the ISO as a workflow artifact (30 days), and — for a version
#      tag or a manual run with "publish release" on — attaches it to a GitHub
#      Release, which is the link to hand to whoever installs the appliance.
#
# Manual run:  Actions -> Build RNS-OS ISO -> Run workflow
# Tagged run:  git tag rns-os-1.0.1 && git push origin rns-os-1.0.1

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: "Base Debian netinst URL (blank = the pinned candidates)"
        required: false
        default: ""
      publish-release:
        description: "Attach the ISO to a GitHub Release"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "rns-os-*"
    branches:
      - main
    paths:
      - ".github/workflows/build-iso.yml"
      - "RNS-OS/VERSION"
      - "RNS-OS/iso/**"
      - "RNS-OS/payload/**"
      - "RNS-OS/tools/**"
      - "RNS-Gateway/module/rns/**"
      - "RNS-Gateway/src/**"

# One build at a time per ref: two xorriso runs writing the same artifact name
# would race for the upload.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    name: ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso isolinux syslinux-utils busybox-static gcc curl ca-certificates

      - name: Show the version being built
        id: ver
        run: |
          V=$(cat RNS-OS/VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building RNS-OS $V"

      - name: Show the environment the suite will use
        run: |
          echo "shell:   $(readlink -f /bin/sh)"
          echo "busybox: $(command -v busybox) $(busybox 2>&1 | head -n 1)"
          echo "applets: $(busybox --list 2>/dev/null | wc -l)"
          echo "python3: $(python3 -V 2>&1)"
          echo "curl:    $(curl --version 2>&1 | head -n 1)"
          echo "xorriso: $(xorriso --version 2>&1 | head -n 1)"
          echo "cc:      $(cc --version 2>&1 | head -n 1)"

      # The appliance test suite needs no root, no VM and no network. It runs
      # the same install-payload.sh the ISO build uses, so what it passes on is
      # what the ISO carries.
      #
      # Each failing line is repeated as an ::error:: annotation on purpose:
      # annotations are readable through the API (and in the run summary) even
      # when the raw step log is not.
      # Fetch the busybox the APPLIANCE installs, not the runner's: Debian 12's
      # busybox-static. (The runner's busybox is the same upstream code built
      # with a different applet set, and the appliance's own busybox has no
      # flock — which is the whole reason rns-bb exists.) The suite then runs
      # the engine through rns-bb with RNS_BUSYBOX pointing at this binary,
      # which is exactly how the appliance runs it.
      - name: Use the busybox the appliance installs
        id: busybox
        run: |
          base=http://deb.debian.org/debian/pool/main/b/busybox/
          file=$(curl -fsS "$base" | grep -oE 'busybox-static_[^"<>]+_amd64\.deb' | sort -V | tail -n1)
          [ -n "$file" ] || { echo "::error::cannot list $base"; exit 1; }
          echo "using $file"
          curl -fsSLo /tmp/busybox.deb "$base$file"
          sudo mkdir -p /opt/rns-busybox
          sudo dpkg-deb -x /tmp/busybox.deb /opt/rns-busybox
          # Modern debs are usrmerged: the binary lands in usr/bin, not bin.
          bb=""
          for cand in /opt/rns-busybox/usr/bin/busybox /opt/rns-busybox/bin/busybox; do
            [ -x "$cand" ] && { bb=$cand; break; }
          done
          if [ -z "$bb" ]; then
            bb=$(find /opt/rns-busybox -type f -name busybox | head -n1)
          fi
          if [ -z "$bb" ]; then
            echo "::error::no busybox binary inside $file"
            find /opt/rns-busybox -type f | head -n 20
            exit 1
          fi
          echo "busybox: $bb"
          # rns-bb looks for /bin/busybox and then for busybox on PATH; CI also
          # names this build explicitly through RNS_BUSYBOX, but the symlink
          # keeps the shim usable by hand in the runner.
          sudo ln -sf "$bb" /usr/local/bin/busybox
          n=$("$bb" --list 2>/dev/null | wc -l)
          echo "::notice::$("$bb" 2>&1 | head -n1) — $n applets"
          # A missing applet is exactly what the platform shim exists for, so
          # record it (it shows up in the run summary) and let the suite decide:
          # it fails if the shim does not cover what is missing.
          if "$bb" --list | grep -qx flock; then
            echo "::notice::this busybox has the flock applet"
          else
            echo "::warning::this busybox has no flock applet — rns-bb is what covers it"
          fi
          echo "busybox=$bb" >> "$GITHUB_OUTPUT"
          echo "shim=$GITHUB_WORKSPACE/RNS-OS/payload/usr/local/lib/rns/bin/rns-bb" >> "$GITHUB_OUTPUT"

      - name: Appliance test suite
        env:
          # The engine under test gets the same platform layer the appliance
          # gives it: the rns-bb shim over the appliance's busybox. Running the
          # suite against bare busybox would test an appliance that does not
          # exist - and did pass, while the store lock never worked, until this
          # was pointed at the shim.
          BB: ${{ steps.busybox.outputs.shim }}
          RNS_BUSYBOX: ${{ steps.busybox.outputs.busybox }}
        run: |
          cd RNS-OS
          set +e
          sh tools/os-selftest.sh 2>&1 | tee /tmp/os-selftest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E '^FAIL' /tmp/os-selftest.log | head -n 20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 3 /tmp/os-selftest.log | while IFS= read -r line; do
              echo "::error::suite tail: $line"
            done
            exit "$rc"
          fi

      # Every failing step repeats its own tail as ::error:: annotations: they
      # are readable through the API and the run summary even where the raw
      # step log is not reachable, which is how this workflow was debugged.
      - name: Build the ISO
        id: build
        run: |
          cd RNS-OS/iso
          set +e
          if [ -n "${{ inputs.base-url }}" ]; then
            ./build-iso.sh --url "${{ inputs.base-url }}" 2>&1 | tee /tmp/build-iso.log
          else
            ./build-iso.sh 2>&1 | tee /tmp/build-iso.log
          fi
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 10 /tmp/build-iso.log | while IFS= read -r line; do
              echo "::error::build-iso: $line"
            done
            exit "$rc"
          fi
          grep -E '^ *done: |sha256 ' /tmp/build-iso.log | while IFS= read -r line; do
            echo "::notice::build-iso: $(echo "$line" | sed 's/^ *//')"
          done
          grep -i 'warning' /tmp/build-iso.log | while IFS= read -r line; do
            echo "::warning::build-iso: $(echo "$line" | sed 's/^ *//')"
          done
          ISO="$PWD/../dist/RNS-OS-$(cat ../VERSION)-amd64.iso"
          test -s "$ISO" || { echo "::error::no ISO was produced"; exit 1; }
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"

      - name: Verify the result
        run: |
          set +e
          ISO="${{ steps.build.outputs.iso }}"
          rm -rf /tmp/iso-check && mkdir -p /tmp/iso-check
          {
            ls -l "$ISO"
            magic=$(dd if="$ISO" bs=1 skip=32769 count=5 2>/dev/null)
            echo "volume descriptor magic: [$magic]"
            [ "$magic" = "CD001" ] || { echo "FAIL not an ISO9660 image"; exit 1; }
            # Extract rather than list: the preseed and the payload both have to
            # be inside, and an ISO missing either installs plain Debian onto a
            # machine nobody can reach.
            xorriso -osirrox on -indev "$ISO" \
              -extract /preseed.cfg /tmp/iso-check/preseed.cfg \
              -extract /rns-payload/usr/share/rns-os/VERSION /tmp/iso-check/payload-version
            [ -s /tmp/iso-check/preseed.cfg ] || {
              echo "FAIL preseed.cfg is not in the image - it would install plain Debian"; exit 1; }
            [ -s /tmp/iso-check/payload-version ] || {
              echo "FAIL the RNS-OS payload is not in the image"; exit 1; }
            echo "preseed: $(wc -l < /tmp/iso-check/preseed.cfg) lines"
            echo "payload version: $(cat /tmp/iso-check/payload-version)"
            grep -q 'rns-os-ctl' /tmp/iso-check/preseed.cfg || {
              echo "FAIL the preseed never runs the payload installer"; exit 1; }
            # The engine locks the store with "$BB" flock around every voucher
            # mint, redeem and payment, and Debian's busybox ships no flock
            # applet. The platform hands the engine rns-bb instead, so the image
            # has to carry it, point BB at it, and record it executable - and
            # the lock has to work through the copy that is inside the ISO.
            xorriso -osirrox on -indev "$ISO" \
              -extract /rns-payload/etc/rns/env /tmp/iso-check/env \
              -extract /rns-payload/usr/local/lib/rns/bin/rns-bb /tmp/iso-check/rns-bb \
              -extract /rns-payload/usr/local/lib/rns/bin/common.sh /tmp/iso-check/common.sh
            grep -q '^BB=/usr/local/lib/rns/bin/rns-bb' /tmp/iso-check/env || {
              echo "FAIL the appliance's BB does not point at rns-bb"; exit 1; }
            grep -q 'with_lock' /tmp/iso-check/common.sh && grep -q 'flock' /tmp/iso-check/common.sh || {
              echo "FAIL the engine in the image does not lock the store with flock"; exit 1; }
            perms=$(xorriso -indev "$ISO" -find /rns-payload/usr/local/lib/rns/bin/rns-bb \
                      -exec lsdl 2>/dev/null | grep -E '^-[a-z-]{9}' | head -n1)
            echo "rns-bb in the image: [$perms]"
            # -r rationalizes the recorded mode, so do not insist on 0755: the
            # owner has to be able to execute it, whoever owns it after install.
            # (The first character is the file type; the owner's execute bit is
            # the fourth, hence -??x.)
            case "$perms" in
              -??x*) ;;
              *) echo "FAIL rns-bb is not executable inside the image: [$perms]"; exit 1 ;;
            esac
            locked=$(sh -c 'exec 9>/tmp/iso-check/lock
                            sh /tmp/iso-check/rns-bb flock -x 9 && echo locked &&
                            sh /tmp/iso-check/rns-bb flock -u 9')
            [ "$locked" = "locked" ] || {
              echo "FAIL the rns-bb inside the image cannot take a lock: [$locked]"; exit 1; }
            echo "store lock: taken and released through the image's own rns-bb"
            base=$(sed -n 's/^ *base image ok:/base:/p' /tmp/build-iso.log | head -n1)
            echo "::notice::$base"
            echo "::notice::ISO $(basename "$ISO") $(stat -c %s "$ISO") bytes sha256 $(sha256sum "$ISO" | cut -d' ' -f1)"
            cd "$(dirname "$ISO")"
            sha256sum "$(basename "$ISO")" | tee SHA256SUMS
            ls -lh "$ISO"
            echo "verify: the image is bootable media with the appliance inside"
          } 2>&1 | tee /tmp/verify.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # The FAIL line first: xorriso prints several cheerful lines about
            # the image it just read, and they buried the reason twice.
            grep -E 'FAIL|error' /tmp/verify.log | head -n 6 | while IFS= read -r line; do
              echo "::error::verify: $line"
            done
            tail -n 6 /tmp/verify.log | while IFS= read -r line; do
              echo "::error::verify: $line"
            done
            exit "$rc"
          fi

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: RNS-OS-${{ steps.ver.outputs.version }}-amd64-iso
          path: |
            RNS-OS/dist/RNS-OS-*-amd64.iso
            RNS-OS/dist/SHA256SUMS
          retention-days: 30
          compression-level: 0

      # A tag is a release; a manual run can ask for one. A plain push to main
      # only produces the artifact, so repeated work does not spam releases.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/rns-os-') || inputs.publish-release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          ISO="${{ steps.build.outputs.iso }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="rns-os-${V}"; fi
          NOTES="RNS-OS ${V} — the RNS Gateway as a bootable Debian 12 appliance for Oracle VirtualBox.

          Download \`$(basename "$ISO")\`, then follow
          [iso/vm/VirtualBox.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/RNS-OS/iso/vm/VirtualBox.md):
          create the VM (or run \`iso/vm/create-vm.sh --iso FILE\`), boot it, and the installer runs unattended.

          Default console login is \`root\` / \`rnsos\` — change it with \`passwd\` on first login. The staff panel
          password is generated on first boot and printed there (and in \`/etc/rns/admin-password.txt\`).

          \`\`\`
          $(cat RNS-OS/dist/SHA256SUMS)
          \`\`\`

          Built from ${GITHUB_SHA} by \`.github/workflows/build-iso.yml\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ISO" RNS-OS/dist/SHA256SUMS --clobber
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "$TAG" "$ISO" RNS-OS/dist/SHA256SUMS \
              --title "RNS-OS $V (amd64 ISO)" --notes "$NOTES"
          else
            gh release create "$TAG" "$ISO" RNS-OS/dist/SHA256SUMS \
              --title "RNS-OS $V (amd64 ISO)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
